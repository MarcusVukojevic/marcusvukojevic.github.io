name: Sync publications from OpenAlex and arXiv

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-publications
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the site
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch and reconcile publication metadata
        run: python scripts/sync_publications.py

      - name: Commit metadata changes
        shell: bash
        run: |
          if git diff --quiet -- _data/publications.yml; then
            echo "Publication metadata is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- _data/publications.yml
          git commit -m "chore: sync publication metadata"
          git push
